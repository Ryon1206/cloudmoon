<!DOCTYPE html>
<html lang="ja">
<head> 
  <meta charset="UTF-8"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"> 
  <title>CloudMoon Portal</title>  
  <script src="https://cdn.tailwindcss.com"></script> 
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.344.0/dist/umd/lucide.min.js"></script> 
  <style>  
    body { background-color: #0f172a; color: white; font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; } 
    ::-webkit-scrollbar { width: 6px; height: 6px; } 
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; } 
    .category-btn { background-color: #1e293b; color: #94a3b8; } 
    .category-btn.active { background-color: #8b5cf6; color: white; } 
    .game-card-item { 
      aspect-ratio: 16/10; 
      background: #1e293b; 
      border: 1px solid rgba(255, 255, 255, 0.1); 
      transition: all 0.2s ease; 
      cursor: pointer; 
      position: relative; 
      overflow: hidden; 
      border-radius: 12px; 
    } 
    .game-card-item:hover { 
      transform: translateY(-3px); 
      border-color: #8b5cf6; 
      box-shadow: 0 8px 20px -5px rgba(139, 92, 246, 0.4); 
    } 
    .card-banner { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; } 
    .card-overlay { 
      position: absolute; 
      inset: 0; 
      background: linear-gradient(to top, rgba(15, 23, 42, 0.95) 0%, rgba(15, 23, 42, 0.2) 60%, transparent 100%); 
      display: flex; 
      flex-direction: column; 
      justify-content: flex-end; 
      padding: 8px 10px; 
    } 
    .loader-spin { border: 3px solid rgba(255,255,255,0.1); border-top-color: #8b5cf6; border-radius: 50%; width: 40px; height: 40px; animation: spin 0.8s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body> 
  <div id="app" class="min-h-screen pb-12"> 
    <!-- ヘッダー -->
    <nav class="sticky top-0 z-40 bg-[#0f172a]/95 backdrop-blur-md border-b border-white/10 px-4 py-3 flex justify-between items-center gap-4"> 
      <div class="flex items-center gap-2"> 
        <div class="w-8 h-8 rounded-lg bg-[#8b5cf6] flex items-center justify-center font-black text-white text-lg">CM</div>
        <span class="text-xl font-black text-white">Cloud<span class="text-[#8b5cf6]">Moon</span></span> 
      </div> 
      <div class="flex-1 max-w-md"> 
        <input type="text" placeholder="Search 30+ games..." class="w-full h-9 bg-slate-800 border border-white/10 rounded-xl px-4 text-xs text-white outline-none focus:border-[#8b5cf6]" oninput="App.search(this.value)"> 
      </div> 
    </nav> 

    <!-- カテゴリ -->
    <div id="category-bar" class="max-w-7xl mx-auto px-4 pt-4 flex gap-2 overflow-x-auto"></div> 

    <!-- カウント -->
    <div class="max-w-7xl mx-auto px-4 pt-3 text-xs text-slate-400">
      <span id="game-count">Loading...</span>
    </div>

    <!-- ゲーム一覧（グリッド） -->
    <main class="max-w-7xl mx-auto p-4">
      <div id="game-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3"></div>
    </main> 

    <!-- プレイヤー画面モーダル（画面真っ暗・404エラー防止構造） -->
    <div id="player-modal" class="fixed inset-0 z-50 hidden bg-black">
      <div class="absolute top-4 left-4 right-4 z-50 flex justify-between items-center pointer-events-none">
        <button onclick="App.closePlayer()" class="pointer-events-auto bg-slate-900/80 border border-white/20 text-white px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-2">
          ← Exit Game
        </button>
        <span id="player-title" class="text-xs font-bold bg-black/60 px-3 py-1.5 rounded-lg text-slate-300"></span>
      </div>

      <div id="player-content" class="w-full h-full flex flex-col items-center justify-center relative">
        <div id="player-loader" class="flex flex-col items-center gap-3">
          <div class="loader-spin"></div>
          <span class="text-xs font-bold text-slate-400">Launching Virtual Machine...</span>
        </div>
        <div id="player-screen" class="hidden flex-col items-center gap-4 text-center max-w-sm p-6 bg-slate-900 border border-white/10 rounded-2xl shadow-2xl">
          <img id="player-icon" class="w-20 h-20 rounded-xl object-cover border-2 border-[#8b5cf6]" src="" alt="icon">
          <h2 id="player-name" class="text-lg font-bold text-white"></h2>
          <p class="text-xs text-slate-400">Virtual Instance Connected. Device Session Active.</p>
          <button onclick="alert('Session Running!')" class="w-full bg-[#8b5cf6] text-white py-2.5 rounded-xl text-xs font-bold">▶ Start Control</button>
        </div>
      </div>
    </div>
  </div> 

  <script>
    window.App = {
      games: [
        { id: '1', title: 'Genshin Impact', cat: 'rpg', img: 'https://images2.alphacoders.com/110/1108237.jpg' },
        { id: '2', title: 'Honkai: Star Rail', cat: 'rpg', img: 'https://images8.alphacoders.com/131/1312388.jpeg' },
        { id: '3', title: 'Zenless Zone Zero', cat: 'action', img: 'https://images7.alphacoders.com/136/1360341.png' },
        { id: '4', title: 'Wuthering Waves', cat: 'rpg', img: 'https://images3.alphacoders.com/136/1360155.png' },
        { id: '5', title: 'Roblox', cat: 'casual', img: 'https://images7.alphacoders.com/112/1126938.png' },
        { id: '6', title: 'PUBG MOBILE', cat: 'action', img: 'https://images.alphacoders.com/908/908323.jpg' },
        { id: '7', title: 'Call of Duty: Mobile', cat: 'action', img: 'https://images6.alphacoders.com/105/1055745.jpg' },
        { id: '8', title: 'Apex Legends Mobile', cat: 'action', img: 'https://images2.alphacoders.com/123/1230489.png' },
        { id: '9', title: 'Minecraft', cat: 'casual', img: 'https://images.alphacoders.com/133/1331700.png' },
        { id: '10', title: 'Brawl Stars', cat: 'casual', img: 'https://images4.alphacoders.com/985/985790.jpg' },
        { id: '11', title: 'Clash Royale', cat: 'strategy', img: 'https://images2.alphacoders.com/687/687834.jpg' },
        { id: '12', title: 'Clash of Clans', cat: 'strategy', img: 'https://images3.alphacoders.com/565/565022.jpg' },
        { id: '13', title: 'eFootball 2024', cat: 'sports', img: 'https://images2.alphacoders.com/133/1332997.jpeg' },
        { id: '14', title: 'Wild Rift', cat: 'strategy', img: 'https://images4.alphacoders.com/112/1120286.jpg' },
        { id: '15', title: 'Asphalt 9', cat: 'sports', img: 'https://images.alphacoders.com/936/936306.jpg' },
        { id: '16', title: 'Solo Leveling: Arise', cat: 'action', img: 'https://images2.alphacoders.com/135/1359300.jpeg' },
        { id: '17', title: 'FC Mobile', cat: 'sports', img: 'https://images.alphacoders.com/133/1333100.jpeg' },
        { id: '18', title: 'Free Fire', cat: 'action', img: 'https://images6.alphacoders.com/102/1020612.jpg' },
        { id: '19', title: 'Mobile Legends', cat: 'action', img: 'https://images8.alphacoders.com/109/1091230.jpg' },
        { id: '20', title: 'Tower of Fantasy', cat: 'rpg', img: 'https://images6.alphacoders.com/125/1252110.jpg' },
        { id: '21', title: 'NIKKE', cat: 'action', img: 'https://images7.alphacoders.com/128/1286300.jpeg' },
        { id: '22', title: 'Blue Archive', cat: 'rpg', img: 'https://images3.alphacoders.com/129/1297120.png' },
        { id: '23', title: 'Fate/Grand Order', cat: 'rpg', img: 'https://images7.alphacoders.com/835/835150.jpg' },
        { id: '24', title: 'Arknights', cat: 'strategy', img: 'https://images5.alphacoders.com/106/1063200.jpg' },
        { id: '25', title: 'Dragon Ball Legends', cat: 'action', img: 'https://images4.alphacoders.com/922/922880.jpg' },
        { id: '26', title: 'One Piece Bounty Rush', cat: 'action', img: 'https://images2.alphacoders.com/114/1145210.jpg' },
        { id: '27', title: 'Pokémon UNITE', cat: 'action', img: 'https://images6.alphacoders.com/116/1163400.jpg' },
        { id: '28', title: 'Stumble Guys', cat: 'casual', img: 'https://images2.alphacoders.com/127/1278100.png' },
        { id: '29', title: 'Among Us', cat: 'casual', img: 'https://images2.alphacoders.com/110/1107500.jpg' },
        { id: '30', title: 'Identity V', cat: 'action', img: 'https://images4.alphacoders.com/952/952100.jpg' }
      ],
      currentCategory: 'all',
      query: '',

      init() {
        this.renderCategories();
        this.renderGrid();
      },

      renderCategories() {
        const cats = ['all', 'action', 'rpg', 'casual', 'sports', 'strategy'];
        const bar = document.getElementById('category-bar');
        bar.innerHTML = cats.map(c => `
          <button onclick="App.setCategory('${c}')" class="category-btn px-4 py-1.5 rounded-xl text-xs font-bold uppercase ${this.currentCategory === c ? 'active' : ''}">${c}</button>
        `).join('');
      },

      setCategory(cat) {
        this.currentCategory = cat;
        this.renderCategories();
        this.renderGrid();
      },

      search(val) {
        this.query = val.toLowerCase();
        this.renderGrid();
      },

      renderGrid() {
        const list = this.games.filter(g => {
          const matchCat = this.currentCategory === 'all' || g.cat === this.currentCategory;
          const matchQ = g.title.toLowerCase().includes(this.query);
          return matchCat && matchQ;
        });

        document.getElementById('game-count').textContent = `Displaying ${list.length} Games`;
        const grid = document.getElementById('game-grid');
        
        grid.innerHTML = list.map(g => `
          <div class="game-card-item" onclick="App.playGame('${g.title}', '${g.img}')">
            <img src="${g.img}" class="card-banner" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1542751371-adc38448a05e?w=500&q=80'">
            <div class="card-overlay">
              <span class="text-xs font-bold text-white line-clamp-1">${g.title}</span>
            </div>
          </div>
        `).join('');
      },

      playGame(title, img) {
        const modal = document.getElementById('player-modal');
        document.getElementById('player-title').textContent = title;
        document.getElementById('player-name').textContent = title;
        document.getElementById('player-icon').src = img;

        modal.classList.remove('hidden');
        document.getElementById('player-loader').classList.remove('hidden');
        document.getElementById('player-screen').classList.add('hidden');

        // 1秒後に黒画面にならずにプレイヤー画面へ接続
        setTimeout(() => {
          document.getElementById('player-loader').classList.add('hidden');
          document.getElementById('player-screen').classList.remove('hidden');
          document.getElementById('player-screen').classList.add('flex');
        }, 1000);
      },

      closePlayer() {
        document.getElementById('player-modal').classList.add('hidden');
      }
    };

    window.addEventListener('DOMContentLoaded', () => App.init());
  </script>
</body>
</html>
