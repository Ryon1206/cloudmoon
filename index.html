<!DOCTYPE html>
<html lang="ja">
<head> 
  <meta charset="UTF-8"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"> 
  <title>CloudMoon Portal</title>  
  <script src="https://cdn.tailwindcss.com"></script> 
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.344.0/dist/umd/lucide.min.js"></script> 
  <style>  
    :root { --bg-main: #0f172a; --primary: #8b5cf6; } 
    body { background-color: #0f172a; color: white; font-family: system-ui, -apple-system, sans-serif; } 
    ::-webkit-scrollbar { width: 6px; height: 6px; } 
    ::-webkit-scrollbar-track { background: transparent; } 
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; } 
    .category-btn { background-color: #1e293b; color: #94a3b8; } 
    .category-btn.active { background-color: #8b5cf6; color: white; } 
    .no-scrollbar::-webkit-scrollbar { display: none; } 
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; } 
    .game-card-item { 
      aspect-ratio: 16/10; 
      background: #1e293b; 
      border: 1px solid rgba(255, 255, 255, 0.1); 
      transition: all 0.25s ease; 
      cursor: pointer; 
      position: relative; 
      overflow: hidden; 
      border-radius: 14px; 
    } 
    .game-card-item:hover { 
      transform: translateY(-4px); 
      border-color: #8b5cf6; 
      box-shadow: 0 10px 20px -5px rgba(139, 92, 246, 0.4); 
    } 
    .card-banner { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s ease; } 
    .game-card-item:hover .card-banner { transform: scale(1.05); } 
    .card-overlay { 
      position: absolute; 
      inset: 0; 
      background: linear-gradient(to top, rgba(15, 23, 42, 0.95) 0%, rgba(15, 23, 42, 0.3) 60%, transparent 100%); 
      display: flex; 
      flex-direction: column; 
      justify-content: flex-end; 
      padding: 10px 12px; 
    } 
    .login-input { background-color: #1e293b; border: 1px solid rgba(255, 255, 255, 0.1); color: white; width: 100%; padding: 6px 12px; border-radius: 10px; outline: none; } 
  </style>
</head>
<body> 
  <div id="app" class="min-h-screen"> 
    <!-- ナビゲーションバー -->
    <nav class="sticky top-0 z-50 bg-[#0f172a]/95 backdrop-blur-md border-b border-white/10 px-4 py-3 flex flex-col md:flex-row justify-between items-center gap-3"> 
      <div class="flex items-center justify-between w-full md:w-auto gap-4"> 
        <div class="flex items-center gap-2.5"> 
          <div class="w-8 h-8 rounded-lg bg-[#8b5cf6] flex items-center justify-center font-black text-white text-lg">CM</div>
          <span class="text-xl font-black tracking-tight text-white">Cloud<span class="text-[#8b5cf6]">Moon</span></span> 
        </div> 
        <div class="flex items-center gap-3"> 
          <div id="server-select-container"></div> 
          <div id="device-info-badge" class="text-xs bg-slate-800 text-slate-400 px-3 py-1.5 rounded-xl border border-white/5"></div>
        </div> 
      </div> 
      <div class="flex items-center w-full max-w-xl"> 
        <div class="relative w-full"> 
          <i data-lucide="search" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i> 
          <input type="text" id="search-input" placeholder="Search 40+ games..." class="w-full h-10 bg-slate-800 border border-white/10 rounded-xl pl-10 pr-4 text-sm text-white placeholder-slate-400 focus:ring-2 focus:ring-[#8b5cf6]/50 transition-all outline-none" oninput="App.handleSearch(this.value)"> 
        </div> 
      </div> 
    </nav> 

    <!-- 最近プレイしたゲーム -->
    <section id="recent-games-section" class="max-w-7xl mx-auto px-4 pt-4 hidden"> 
      <div class="flex items-center justify-between mb-2">
        <h2 class="text-sm font-bold text-white flex items-center gap-2">
          <i data-lucide="history" class="w-4 h-4 text-[#8b5cf6]"></i>Recently Played
        </h2>
        <button onclick="App.clearRecentGames()" class="text-xs text-slate-400 hover:text-red-400 transition">Clear</button>
      </div> 
      <div id="recent-games-grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-3"></div> 
    </section> 

    <!-- カテゴリバー -->
    <div id="category-bar" class="max-w-7xl mx-auto px-4 pt-4 flex gap-2 overflow-x-auto no-scrollbar"></div> 

    <!-- 件数カウント表示 -->
    <div class="max-w-7xl mx-auto px-4 pt-3 pb-1 text-xs text-slate-400 flex justify-between items-center">
      <span id="game-count-label">Loading games...</span>
    </div>

    <!-- ゲーム一覧 -->
    <main class="max-w-7xl mx-auto p-4 pb-20">
      <div id="game-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
    </main> 

    <!-- ゲーム詳細モーダル -->
    <div id="game-modal" style="display:none;" class="fixed inset-0 z-50"> 
      <div class="absolute inset-0 bg-black/70 backdrop-blur-sm" onclick="App.closeModal()"></div> 
      <div class="absolute bottom-0 left-0 right-0 bg-[#1e293b] border-t border-white/10 p-6 md:top-1/2 md:left-1/2 md:bottom-auto md:w-[460px] md:-translate-x-1/2 md:-translate-y-1/2 md:rounded-3xl md:border shadow-2xl"> 
        <div id="modal-content" class="flex flex-col gap-4"></div> 
      </div> 
    </div> 

    <!-- プレイヤー（ゲーム実行画面モーダル） -->
    <div id="player-modal" style="display:none;" class="fixed inset-0 z-[100] bg-black">
      <div class="absolute top-3 right-3 z-10">
        <button onclick="App.closePlayer()" class="bg-black/80 hover:bg-red-600 text-white font-bold px-4 py-2 rounded-full text-xs transition border border-white/20 shadow-lg">
          ✕ Close Game
        </button>
      </div>
      <iframe id="player-frame" class="w-full h-full border-0" allow="autoplay; gamepad; fullscreen; microphone; camera"></iframe>
    </div>
  </div> 

  <script>
    window.App = {
      rawGames: [],
      filteredGames: [],
      categories: [
        { id: 'all', name: 'All Games' },
        { id: 'action', name: 'Action' },
        { id: 'rpg', name: 'RPG' },
        { id: 'casual', name: 'Casual' },
        { id: 'sports', name: 'Sports' },
        { id: 'strategy', name: 'Strategy' }
      ],
      activeCategory: 'all',
      searchQuery: '',
      deviceId: null,
      recentGames: [],

      init() {
        this.deviceId = this.getDeviceId();
        this.renderDeviceInfo();
        this.renderServerSelect();
        this.loadRecentGames();

        this.renderCategories();
        this.loadGames();
      },

      getDeviceId() {
        let id = localStorage.getItem('cm_device_id');
        if (!id) {
          id = typeof crypto !== 'undefined' && crypto.randomUUID ? crypto.randomUUID() : 'guest_' + Math.random().toString(36).substring(2, 10);
          localStorage.setItem('cm_device_id', id);
        }
        return id;
      },

      renderDeviceInfo() {
        const el = document.getElementById('device-info-badge');
        if (el && this.deviceId) {
          el.innerHTML = `<span class="text-slate-500">ID:</span> <span class="font-mono text-white">${this.deviceId.substring(0, 8)}</span>`;
        }
      },

      renderServerSelect() {
        const container = document.getElementById('server-select-container');
        if (!container) return;
        const currentServer = localStorage.getItem('cm_server_id') || '3';
        
        container.innerHTML = `
          <select id="server-select" class="login-input cursor-pointer text-xs py-1 px-2" onchange="App.handleServerChange(this.value)">
            <option value="3" ${currentServer === '3' ? 'selected' : ''}>Asia Server</option>
            <option value="23" ${currentServer === '23' ? 'selected' : ''}>US East</option>
            <option value="22" ${currentServer === '22' ? 'selected' : ''}>US West</option>
            <option value="4" ${currentServer === '4' ? 'selected' : ''}>Europe</option>
          </select>
        `;
      },

      handleServerChange(val) {
        localStorage.setItem('cm_server_id', val);
      },

      loadGames() {
        // 高解像度リアル画像 & 動作URL付きゲームデータベース
        const db = [
          { title: 'Genshin Impact', cat: ['rpg', 'action'], img: 'https://images2.alphacoders.com/110/1108237.jpg', playUrl: 'https://cloudmoonapp.com/play/genshin-impact' },
          { title: 'Honkai: Star Rail', cat: ['rpg'], img: 'https://images8.alphacoders.com/131/1312388.jpeg', playUrl: 'https://cloudmoonapp.com/play/honkai-star-rail' },
          { title: 'Zenless Zone Zero', cat: ['action'], img: 'https://images7.alphacoders.com/136/1360341.png', playUrl: 'https://cloudmoonapp.com/play/zenless-zone-zero' },
          { title: 'Wuthering Waves', cat: ['rpg', 'action'], img: 'https://images3.alphacoders.com/136/1360155.png', playUrl: 'https://cloudmoonapp.com/play/wuthering-waves' },
          { title: 'Roblox', cat: ['casual', 'action'], img: 'https://images7.alphacoders.com/112/1126938.png', playUrl: 'https://cloudmoonapp.com/play/roblox' },
          { title: 'PUBG MOBILE', cat: ['action'], img: 'https://images.alphacoders.com/908/908323.jpg', playUrl: 'https://cloudmoonapp.com/play/pubg-mobile' },
          { title: 'Call of Duty: Mobile', cat: ['action'], img: 'https://images6.alphacoders.com/105/1055745.jpg', playUrl: 'https://cloudmoonapp.com/play/call-of-duty-mobile' },
          { title: 'Apex Legends Mobile', cat: ['action'], img: 'https://images2.alphacoders.com/123/1230489.png', playUrl: 'https://cloudmoonapp.com/play/apex-legends-mobile' },
          { title: 'Minecraft', cat: ['casual'], img: 'https://images.alphacoders.com/133/1331700.png', playUrl: 'https://cloudmoonapp.com/play/minecraft' },
          { title: 'Brawl Stars', cat: ['action', 'casual'], img: 'https://images4.alphacoders.com/985/985790.jpg', playUrl: 'https://cloudmoonapp.com/play/brawl-stars' },
          { title: 'Clash Royale', cat: ['casual', 'strategy'], img: 'https://images2.alphacoders.com/687/687834.jpg', playUrl: 'https://cloudmoonapp.com/play/clash-royale' },
          { title: 'Clash of Clans', cat: ['strategy'], img: 'https://images3.alphacoders.com/565/565022.jpg', playUrl: 'https://cloudmoonapp.com/play/clash-of-clans' },
          { title: 'eFootball 2024', cat: ['sports'], img: 'https://images2.alphacoders.com/133/1332997.jpeg', playUrl: 'https://cloudmoonapp.com/play/efootball-2024' },
          { title: 'League of Legends: Wild Rift', cat: ['action', 'strategy'], img: 'https://images4.alphacoders.com/112/1120286.jpg', playUrl: 'https://cloudmoonapp.com/play/wild-rift' },
          { title: 'Asphalt 9: Legends', cat: ['sports', 'action'], img: 'https://images.alphacoders.com/936/936306.jpg', playUrl: 'https://cloudmoonapp.com/play/asphalt-9-legends' },
          { title: 'Solo Leveling: Arise', cat: ['action', 'rpg'], img: 'https://images2.alphacoders.com/135/1359300.jpeg', playUrl: 'https://cloudmoonapp.com/play/solo-leveling-arise' },
          { title: 'EA SPORTS FC Mobile', cat: ['sports'], img: 'https://images.alphacoders.com/133/1333100.jpeg', playUrl: 'https://cloudmoonapp.com/play/ea-sports-fc-mobile' },
          { title: 'Free Fire', cat: ['action'], img: 'https://images6.alphacoders.com/102/1020612.jpg', playUrl: 'https://cloudmoonapp.com/play/free-fire' },
          { title: 'Mobile Legends: Bang Bang', cat: ['action'], img: 'https://images8.alphacoders.com/109/1091230.jpg', playUrl: 'https://cloudmoonapp.com/play/mobile-legends' },
          { title: 'Tower of Fantasy', cat: ['rpg', 'action'], img: 'https://images6.alphacoders.com/125/1252110.jpg', playUrl: 'https://cloudmoonapp.com/play/tower-of-fantasy' },
          { title: 'NIKKE: Goddess of Victory', cat: ['action', 'rpg'], img: 'https://images7.alphacoders.com/128/1286300.jpeg', playUrl: 'https://cloudmoonapp.com/play/nikke' },
          { title: 'Blue Archive', cat: ['rpg'], img: 'https://images3.alphacoders.com/129/1297120.png', playUrl: 'https://cloudmoonapp.com/play/blue-archive' },
          { title: 'Fate/Grand Order', cat: ['rpg'], img: 'https://images7.alphacoders.com/835/835150.jpg', playUrl: 'https://cloudmoonapp.com/play/fate-grand-order' },
          { title: 'Arknights', cat: ['strategy', 'rpg'], img: 'https://images5.alphacoders.com/106/1063200.jpg', playUrl: 'https://cloudmoonapp.com/play/arknights' },
          { title: 'Dragon Ball Legends', cat: ['action'], img: 'https://images4.alphacoders.com/922/922880.jpg', playUrl: 'https://cloudmoonapp.com/play/dragon-ball-legends' },
          { title: 'One Piece Bounty Rush', cat: ['action'], img: 'https://images2.alphacoders.com/114/1145210.jpg', playUrl: 'https://cloudmoonapp.com/play/one-piece-bounty-rush' },
          { title: 'Pokémon UNITE', cat: ['casual', 'action'], img: 'https://images6.alphacoders.com/116/1163400.jpg', playUrl: 'https://cloudmoonapp.com/play/pokemon-unite' },
          { title: 'Stumble Guys', cat: ['casual'], img: 'https://images2.alphacoders.com/127/1278100.png', playUrl: 'https://cloudmoonapp.com/play/stumble-guys' },
          { title: 'Among Us', cat: ['casual'], img: 'https://images2.alphacoders.com/110/1107500.jpg', playUrl: 'https://cloudmoonapp.com/play/among-us' },
          { title: 'Identity V', cat: ['action', 'casual'], img: 'https://images4.alphacoders.com/952/952100.jpg', playUrl: 'https://cloudmoonapp.com/play/identity-v' },
          { title: 'Raid: Shadow Legends', cat: ['rpg'], img: 'https://images.alphacoders.com/101/1018200.jpg', playUrl: 'https://cloudmoonapp.com/play/raid-shadow-legends' },
          { title: 'Summoners War', cat: ['rpg', 'strategy'], img: 'https://images3.alphacoders.com/841/841200.jpg', playUrl: 'https://cloudmoonapp.com/play/summoners-war' },
          { title: 'Lords Mobile', cat: ['strategy'], img: 'https://images5.alphacoders.com/812/812300.jpg', playUrl: 'https://cloudmoonapp.com/play/lords-mobile' },
          { title: 'Rise of Kingdoms', cat: ['strategy'], img: 'https://images6.alphacoders.com/100/1005400.jpg', playUrl: 'https://cloudmoonapp.com/play/rise-of-kingdoms' },
          { title: 'Arena of Valor', cat: ['action'], img: 'https://images7.alphacoders.com/883/883100.jpg', playUrl: 'https://cloudmoonapp.com/play/arena-of-valor' }
        ];

        this.rawGames = db.map((item, index) => ({
          id: String(index + 1),
          title: item.title,
          icon: item.img,
          playUrl: item.playUrl,
          categories: item.cat,
          desc: `Play ${item.title} instantly in your browser via CloudMoon.`
        }));

        this.applyFilter();
      },

      renderCategories() {
        const container = document.getElementById('category-bar');
        if (!container) return;

        container.innerHTML = this.categories.map(cat => `
          <button onclick="App.filterByCategory('${cat.id}')" class="category-btn px-4 py-2 rounded-xl text-xs font-bold transition whitespace-nowrap ${this.activeCategory === cat.id ? 'active' : ''}">
            ${cat.name}
          </button>
        `).join('');
      },

      filterByCategory(catId) {
        this.activeCategory = catId;
        this.renderCategories();
        this.applyFilter();
      },

      handleSearch(val) {
        this.searchQuery = val.toLowerCase();
        this.applyFilter();
      },

      applyFilter() {
        this.filteredGames = this.rawGames.filter(game => {
          const matchCat = this.activeCategory === 'all' || game.categories.includes(this.activeCategory);
          const matchSearch = game.title.toLowerCase().includes(this.searchQuery);
          return matchCat && matchSearch;
        });

        const countLabel = document.getElementById('game-count-label');
        if (countLabel) {
          countLabel.textContent = `Showing ${this.filteredGames.length} of ${this.rawGames.length} available games`;
        }

        this.renderGrid();
      },

      renderGrid() {
        const grid = document.getElementById('game-grid');
        if (!grid) return;

        if (this.filteredGames.length === 0) {
          grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-500 text-sm">No games found matching your search.</div>`;
          return;
        }

        grid.innerHTML = this.filteredGames.map(game => `
          <div class="game-card-item" onclick="App.showGameDetails('${game.id}')">
            <img src="${game.icon}" loading="lazy" class="card-banner" alt="${game.title}" onerror="this.src='https://images.unsplash.com/photo-1542751371-adc38448a05e?w=500&q=80'">
            <div class="card-overlay">
              <h3 class="text-xs font-bold text-white line-clamp-1">${game.title}</h3>
            </div>
          </div>
        `).join('');

        if (window.lucide) lucide.createIcons();
      },

      loadRecentGames() {
        const saved = localStorage.getItem('cm_recent_games');
        this.recentGames = saved ? JSON.parse(saved) : [];
        this.renderRecentGames();
      },

      saveRecentGame(game) {
        this.recentGames = this.recentGames.filter(g => g.id !== game.id);
        this.recentGames.unshift(game);
        if (this.recentGames.length > 6) this.recentGames.pop();
        localStorage.setItem('cm_recent_games', JSON.stringify(this.recentGames));
        this.renderRecentGames();
      },

      clearRecentGames() {
        this.recentGames = [];
        localStorage.removeItem('cm_recent_games');
        this.renderRecentGames();
      },

      renderRecentGames() {
        const section = document.getElementById('recent-games-section');
        const grid = document.getElementById('recent-games-grid');
        if (!section || !grid || this.recentGames.length === 0) {
          if (section) section.classList.add('hidden');
          return;
        }
        section.classList.remove('hidden');
        grid.innerHTML = this.recentGames.map(game => `
          <div class="game-card-item" onclick="App.showGameDetails('${game.id}')">
            <img src="${game.icon}" class="card-banner" alt="${game.title}">
            <div class="card-overlay">
              <h3 class="text-xs font-bold text-white line-clamp-1">${game.title}</h3>
            </div>
          </div>
        `).join('');

        if (window.lucide) lucide.createIcons();
      },

      showGameDetails(gameId) {
        const game = this.rawGames.find(g => String(g.id) === String(gameId)) || this.recentGames.find(g => String(g.id) === String(gameId));
        if (!game) return;

        const modal = document.getElementById('game-modal');
        const content = document.getElementById('modal-content');
        modal.style.display = 'block';

        content.innerHTML = `
          <div class="flex gap-4 items-center">
            <img src="${game.icon}" class="w-16 h-16 rounded-2xl object-cover border border-white/10">
            <div>
              <h2 class="text-base font-bold text-white">${game.title}</h2>
              <p class="text-xs text-slate-400 mt-0.5">Cloud Streaming Ready</p>
            </div>
          </div>
          <p class="text-xs text-slate-300 leading-relaxed">${game.desc}</p>
          <div class="flex gap-2 pt-2">
            <button onclick="App.launchGame('${game.id}', '${game.title}', '${game.icon}', '${game.playUrl}')" class="flex-1 bg-[#8b5cf6] hover:bg-[#7c3aed] text-white font-bold py-3 rounded-xl transition shadow-lg shadow-purple-500/25 text-xs">
              ⚡ Play Instant
            </button>
            <a href="${game.playUrl}" target="_blank" onclick="App.saveRecentGame({ id: '${game.id}', title: '${game.title}', icon: '${game.icon}' })" class="px-4 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-3 rounded-xl transition text-xs flex items-center justify-center">
              ↗ External
            </a>
          </div>
        `;
      },

      closeModal() {
        document.getElementById('game-modal').style.display = 'none';
      },

      launchGame(gameId, title, icon, playUrl) {
        this.saveRecentGame({ id: gameId, title: title, icon: icon, playUrl: playUrl });
        this.closeModal();

        // 埋め込みプレイヤー画面を起動
        const playerModal = document.getElementById('player-modal');
        const playerFrame = document.getElementById('player-frame');
        
        playerFrame.src = playUrl;
        playerModal.style.display = 'block';
      },

      closePlayer() {
        const playerModal = document.getElementById('player-modal');
        const playerFrame = document.getElementById('player-frame');
        
        playerFrame.src = '';
        playerModal.style.display = 'none';
      }
    };

    window.addEventListener('DOMContentLoaded', () => {
      window.App.init();
    });
  </script>
</body>
</html>
