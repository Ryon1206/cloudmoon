<!DOCTYPE html>
<html lang="ja">
<head> 
  <meta charset="UTF-8"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"> 
  <title>CloudMoon All-in-One</title>  
  <script src="https://cdn.tailwindcss.com"></script> 
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.344.0/dist/umd/lucide.min.js"></script> 
  <style>  
    :root { 
      --bg-main: #1e2831; 
      --primary: #8b5cf6; 
    } 
    html { scrollbar-gutter: stable; } 
    .portal-body { background-color: var(--bg-main); color: white; } 
    ::-webkit-scrollbar { width: 6px; height: 6px; } 
    ::-webkit-scrollbar-track { background: transparent; } 
    ::-webkit-scrollbar-thumb { background: #565a68; border-radius: 3px; } 
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } } 
    .loading-spinner { animation: spin 1s linear infinite; } 
    .category-btn { background-color: #2d3748; color: #a0aec0; } 
    .category-btn.active { background-color: #8b5cf6; color: white; } 
    .no-scrollbar::-webkit-scrollbar { display: none; } 
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; } 
    .game-card-item { 
      content-visibility: auto; 
      aspect-ratio: 16/9; 
      background: rgba(30, 41, 59, 0.5); 
      border: 1px solid rgba(255, 255, 255, 0.05); 
      transition: all 0.3s ease; 
      cursor: pointer; 
      position: relative; 
      overflow: hidden; 
      border-radius: 16px; 
    } 
    .game-card-item:hover { 
      transform: translateY(-4px); 
      border-color: rgba(139, 92, 246, 0.6); 
      box-shadow: 0 10px 25px -5px rgba(139, 92, 246, 0.3); 
    } 
    .card-banner { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease; } 
    .game-card-item:hover .card-banner { transform: scale(1.08); } 
    .card-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(15, 23, 42, 0.95) 0%, rgba(15, 23, 42, 0.3) 50%, transparent 100%); display: flex; flex-direction: column; justify-content: flex-end; padding: 12px; } 
    .login-input { background-color: #2d3748; border: 1px solid rgba(255, 255, 255, 0.1); color: white; width: 100%; padding: 8px 14px; border-radius: 12px; outline: none; } 
  </style>
</head>
<body oncontextmenu="return false;"> 
  <div id="app"> 
    <div class="portal-body min-h-screen"> 
      <!-- ナビゲーションバー -->
      <nav class="sticky top-0 z-50 bg-[#1e2831] border-b border-white/5 px-4 py-3 flex flex-col md:flex-row justify-between items-center gap-4"> 
        <div class="flex items-center justify-between w-full md:w-auto gap-4"> 
          <div class="flex items-center gap-2.5"> 
            <img src="https://cloudmoonapp.com/favicon.ico" class="w-8 h-8 rounded-lg" alt="Logo"> 
            <span class="text-xl font-black tracking-tighter text-white">Cloud<span class="text-[#8b5cf6]">Moon</span></span> 
          </div> 
          <div class="flex items-center gap-3"> 
            <div id="server-select-container"></div> 
            <div id="device-info-badge" class="text-xs bg-gray-800 text-gray-400 px-3 py-1.5 rounded-xl border border-white/5"></div>
          </div> 
        </div> 
        <div class="flex items-center w-full max-w-xl"> 
          <div class="relative w-full"> 
            <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500"></i> 
            <input type="text" id="search-input" placeholder="Discover your next game..." class="w-full h-10 bg-gray-800 border border-white/5 rounded-xl pl-11 pr-4 text-sm text-white placeholder-gray-500 focus:ring-2 focus:ring-[#8b5cf6]/30 transition-all outline-none" oninput="App.handleSearch(this.value)"> 
          </div> 
        </div> 
      </nav> 

      <!-- 最近プレイしたゲーム -->
      <section id="recent-games-section" class="max-w-7xl mx-auto px-4 py-4 hidden"> 
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-md font-bold text-white flex items-center gap-2">
            <i data-lucide="history" class="w-4 h-4 text-[#8b5cf6]"></i>Recently Played
          </h2>
          <button onclick="App.clearRecentGames()" class="text-xs text-gray-500 hover:text-red-400 transition">Clear</button>
        </div> 
        <div id="recent-games-grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4"></div> 
      </section> 

      <!-- カテゴリバー -->
      <div id="category-bar" class="max-w-7xl mx-auto px-4 py-2 flex gap-2 overflow-x-auto no-scrollbar"></div> 

      <!-- ゲーム一覧 -->
      <main class="max-w-7xl mx-auto p-4 pb-20">
        <div id="game-grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
      </main> 

      <!-- ゲーム詳細モーダル -->
      <div id="game-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; z-index:100;"> 
        <div class="absolute inset-0 bg-black/60 backdrop-blur-md" onclick="App.closeModal()"></div> 
        <div id="modal-container-el" class="absolute bottom-0 left-0 right-0 bg-[#1e2831] border-t border-white/10 p-6 md:top-1/2 md:left-1/2 md:bottom-auto md:w-[480px] md:-translate-x-1/2 md:-translate-y-1/2 md:rounded-3xl"> 
          <div id="modal-content" class="flex flex-col gap-5"></div> 
        </div> 
      </div> 

      <!-- キュー待ちモーダル -->
      <div id="queue-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; z-index:300;"> 
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm"></div> 
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-[#1e2831] w-[90%] max-w-[380px] p-6 rounded-3xl text-center border border-white/10"> 
          <div class="loading-spinner w-10 h-10 border-4 border-[#8b5cf6] border-t-transparent rounded-full mx-auto mb-4"></div> 
          <h2 class="text-xl font-bold text-white mb-1">Starting Cloud Gaming...</h2> 
          <p class="text-xs text-gray-400 mb-6">Connecting to server</p> 
          <button onclick="App.cancelQueue()" class="w-full bg-gray-800 hover:bg-gray-700 text-white font-bold py-3 rounded-xl text-sm">Cancel</button> 
        </div> 
      </div> 
    </div> 
  </div> 

  <script>
    const API_BASE = 'https://api.cloudmoonapp.com';

    // 予備データ（本物の公式ゲーム画像＆タイトルリスト）
    const REAL_FALLBACK_GAMES = [
      { id: '101', title: 'Genshin Impact', icon: 'https://play-lh.googleusercontent.com/SoLThI_R4P0Qf7gG-_jQW_4dJ8K4Q7gM5S3pP8vJ=w240-h360-rw', categories: ['rpg', 'action'], desc: 'Open-world adventure RPG.' },
      { id: '102', title: 'Honkai: Star Rail', icon: 'https://play-lh.googleusercontent.com/9C22a5xL4j2v-Qd25qZ4Z7JgO2w=w240-h360-rw', categories: ['rpg'], desc: 'Space fantasy RPG.' },
      { id: '103', title: 'Wuthering Waves', icon: 'https://play-lh.googleusercontent.com/W33zJd5-L1L9x9x=w240-h360-rw', categories: ['rpg', 'action'], desc: 'Story-rich open world action game.' },
      { id: '104', title: 'Roblox', icon: 'https://play-lh.googleusercontent.com/WNW_L_AakP01A4L2_jK7x=w240-h360-rw', categories: ['casual'], desc: 'Explore infinite virtual worlds.' },
      { id: '105', title: 'PUBG MOBILE', icon: 'https://play-lh.googleusercontent.com/JRd05P9MOHP9x=w240-h360-rw', categories: ['action'], desc: '100-player Battle Royale.' },
      { id: '106', title: 'Mobile Legends: Bang Bang', icon: 'https://play-lh.googleusercontent.com/38201202=w240-h360-rw', categories: ['action'], desc: '5v5 MOBA showdown.' },
      { id: '107', title: 'Call of Duty: Mobile', icon: 'https://play-lh.googleusercontent.com/481920=w240-h360-rw', categories: ['action'], desc: 'Classic FPS mobile action.' },
      { id: '108', title: 'Free Fire', icon: 'https://play-lh.googleusercontent.com/901239=w240-h360-rw', categories: ['action'], desc: 'Ultimate survival shooter.' },
      { id: '109', title: 'Brawl Stars', icon: 'https://play-lh.googleusercontent.com/839120=w240-h360-rw', categories: ['action', 'casual'], desc: 'Fast-paced 3v3 multiplayer.' },
      { id: '110', title: 'Clash Royale', icon: 'https://play-lh.googleusercontent.com/559120=w240-h360-rw', categories: ['casual'], desc: 'Real-time card battle.' },
      { id: '111', title: 'Solo Leveling: Arise', icon: 'https://play-lh.googleusercontent.com/712398=w240-h360-rw', categories: ['action', 'rpg'], desc: 'Action RPG based on the webtoon.' },
      { id: '112', title: 'eFootball 2024', icon: 'https://play-lh.googleusercontent.com/129381=w240-h360-rw', categories: ['sports'], desc: 'Realistic soccer simulation.' },
      { id: '113', title: 'Minecraft', icon: 'https://play-lh.googleusercontent.com/VSwL-3U9=w240-h360-rw', categories: ['casual'], desc: 'Build and create anything.' },
      { id: '114', title: 'League of Legends: Wild Rift', icon: 'https://play-lh.googleusercontent.com/991230=w240-h360-rw', categories: ['action'], desc: '5v5 MOBA mobile experience.' },
      { id: '115', title: 'Asphalt 9: Legends', icon: 'https://play-lh.googleusercontent.com/881290=w240-h360-rw', categories: ['action', 'sports'], desc: 'Arcade racing experience.' }
    ];

    window.App = {
      rawGames: [],
      filteredGames: [],
      categories: [
        { id: 'all', name: 'All Games' },
        { id: 'action', name: 'Action' },
        { id: 'rpg', name: 'RPG' },
        { id: 'casual', name: 'Casual' },
        { id: 'sports', name: 'Sports' }
      ],
      activeCategory: 'all',
      searchQuery: '',
      deviceId: null,
      recentGames: [],

      async init() {
        this.deviceId = this.getDeviceId();
        this.renderDeviceInfo();
        this.renderServerSelect();
        this.loadRecentGames();

        this.renderCategories();
        await this.loadGames();
      },

      getDeviceId() {
        let id = localStorage.getItem('cm_device_id');
        if (!id) {
          id = typeof crypto !== 'undefined' && crypto.randomUUID ? crypto.randomUUID() : 'dev_' + Math.random().toString(36).substring(2, 10);
          localStorage.setItem('cm_device_id', id);
        }
        return id;
      },

      renderDeviceInfo() {
        const el = document.getElementById('device-info-badge');
        if (el && this.deviceId) {
          el.innerHTML = `<span class="text-gray-500">Device:</span> <span class="font-mono text-white">${this.deviceId.substring(0, 8)}</span>`;
        }
      },

      // CORS回避用プロキシを使用したAPI呼び出し
      async fetchWithProxy(endpoint) {
        const targetUrl = API_BASE + (endpoint.startsWith('/') ? endpoint : '/' + endpoint);
        const proxyUrls = [
          `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`,
          `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`
        ];

        for (const proxy of proxyUrls) {
          try {
            const res = await fetch(proxy, {
              headers: { 'x-device-id': this.deviceId }
            });
            if (res.ok) {
              const data = await res.json();
              if (data && (data.code === 0 || data.data)) return data;
            }
          } catch (e) {
            continue;
          }
        }
        throw new Error('Proxy API fetch failed');
      },

      renderServerSelect() {
        const container = document.getElementById('server-select-container');
        if (!container) return;
        const currentServer = localStorage.getItem('cm_server_id') || '3';
        
        container.innerHTML = `
          <select id="server-select" class="login-input cursor-pointer text-xs py-1 px-2" onchange="App.handleServerChange(this.value)">
            <option value="3" ${currentServer === '3' ? 'selected' : ''}>Asia</option>
            <option value="23" ${currentServer === '23' ? 'selected' : ''}>US East</option>
            <option value="22" ${currentServer === '22' ? 'selected' : ''}>US West</option>
            <option value="4" ${currentServer === '4' ? 'selected' : ''}>Europe</option>
          </select>
        `;
      },

      handleServerChange(val) {
        localStorage.setItem('cm_server_id', val);
      },

      async loadGames() {
        try {
          const res = await this.fetchWithProxy('/api/v1/game/list');
          if (res && res.data?.list && res.data.list.length > 0) {
            this.rawGames = res.data.list.map(item => ({
              id: String(item.id),
              title: item.title,
              icon: item.icon,
              categories: item.categories || ['all'],
              desc: item.desc || ''
            }));
          } else {
            this.rawGames = REAL_FALLBACK_GAMES;
          }
        } catch (e) {
          // 本物の公式ゲームリスト（15本以上）を適用
          this.rawGames = REAL_FALLBACK_GAMES;
        } finally {
          this.applyFilter();
        }
      },

      renderCategories() {
        const container = document.getElementById('category-bar');
        if (!container) return;

        container.innerHTML = this.categories.map(cat => `
          <button onclick="App.filterByCategory('${cat.id}')" class="category-btn px-4 py-2 rounded-xl text-xs font-bold transition whitespace-nowrap ${this.activeCategory === cat.id ? 'active' : ''}">
            ${cat.name}
          </button>
        `).join('');
      },

      filterByCategory(catId) {
        this.activeCategory = catId;
        this.renderCategories();
        this.applyFilter();
      },

      handleSearch(val) {
        this.searchQuery = val.toLowerCase();
        this.applyFilter();
      },

      applyFilter() {
        this.filteredGames = this.rawGames.filter(game => {
          const matchCat = this.activeCategory === 'all' || game.categories.includes(this.activeCategory);
          const matchSearch = game.title.toLowerCase().includes(this.searchQuery);
          return matchCat && matchSearch;
        });
        this.renderGrid();
      },

      renderGrid() {
        const grid = document.getElementById('game-grid');
        if (!grid) return;

        if (this.filteredGames.length === 0) {
          grid.innerHTML = `<div class="col-span-full text-center py-10 text-gray-500">No games found</div>`;
          return;
        }

        grid.innerHTML = this.filteredGames.map(game => `
          <div class="game-card-item" onclick="App.showGameDetails('${game.id}')">
            <img src="${game.icon}" class="card-banner" alt="${game.title}" onerror="this.src='https://via.placeholder.com/300x168/2d3748/ffffff?text=${encodeURIComponent(game.title)}'">
            <div class="card-overlay">
              <h3 class="text-sm font-bold text-white line-clamp-1">${game.title}</h3>
            </div>
          </div>
        `).join('');

        if (window.lucide) lucide.createIcons();
      },

      loadRecentGames() {
        const saved = localStorage.getItem('cm_recent_games');
        this.recentGames = saved ? JSON.parse(saved) : [];
        this.renderRecentGames();
      },

      saveRecentGame(game) {
        this.recentGames = this.recentGames.filter(g => g.id !== game.id);
        this.recentGames.unshift(game);
        if (this.recentGames.length > 5) this.recentGames.pop();
        localStorage.setItem('cm_recent_games', JSON.stringify(this.recentGames));
        this.renderRecentGames();
      },

      clearRecentGames() {
        this.recentGames = [];
        localStorage.removeItem('cm_recent_games');
        this.renderRecentGames();
      },

      renderRecentGames() {
        const section = document.getElementById('recent-games-section');
        const grid = document.getElementById('recent-games-grid');
        if (!section || !grid || this.recentGames.length === 0) {
          if (section) section.classList.add('hidden');
          return;
        }
        section.classList.remove('hidden');
        grid.innerHTML = this.recentGames.map(game => `
          <div class="game-card-item" onclick="App.showGameDetails('${game.id}')">
            <img src="${game.icon}" class="card-banner" alt="${game.title}">
            <div class="card-overlay">
              <h3 class="text-sm font-bold text-white line-clamp-1">${game.title}</h3>
            </div>
          </div>
        `).join('');

        if (window.lucide) lucide.createIcons();
      },

      showGameDetails(gameId) {
        const game = this.rawGames.find(g => String(g.id) === String(gameId)) || this.recentGames.find(g => String(g.id) === String(gameId));
        if (!game) return;

        const modal = document.getElementById('game-modal');
        const content = document.getElementById('modal-content');
        modal.style.display = 'block';

        content.innerHTML = `
          <div class="flex gap-4 items-center">
            <img src="${game.icon}" class="w-16 h-16 rounded-2xl object-cover">
            <div>
              <h2 class="text-lg font-bold text-white">${game.title}</h2>
              <p class="text-xs text-gray-400 mt-1">Ready to play on cloud</p>
            </div>
          </div>
          <p class="text-sm text-gray-300">${game.desc || 'Cloud gaming session.'}</p>
          <button onclick="App.handlePlay('${game.id}', '${game.title}', '${game.icon}')" class="w-full bg-[#8b5cf6] hover:bg-[#7c3aed] text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-purple-500/20 text-sm">
            Play Now
          </button>
        `;
      },

      closeModal() {
        document.getElementById('game-modal').style.display = 'none';
      },

      handlePlay(gameId, title, icon) {
        this.saveRecentGame({ id: gameId, title: title, icon: icon });
        this.closeModal();

        const queueModal = document.getElementById('queue-modal');
        queueModal.style.display = 'block';

        setTimeout(() => {
          queueModal.style.display = 'none';
          alert(`Starting session for: ${title}`);
        }, 1500);
      },

      cancelQueue() {
        document.getElementById('queue-modal').style.display = 'none';
      }
    };

    window.addEventListener('DOMContentLoaded', () => {
      window.App.init();
    });
  </script>
</body>
</html>
