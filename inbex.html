<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudMoon Portal</title>
  <style>
    body { font-family: sans-serif; background: #121212; color: #fff; padding: 20px; }
    .card { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 10px; }
    button { background: #4f46e5; color: #fff; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>CloudMoon</h1>
  <div class="card">
    <h3>端末識別ID</h3>
    <p id="device-id">読み込み中...</p>
  </div>

  <div class="card">
    <h3>端末セーブデータ</h3>
    <p id="save-status">セーブデータはありません</p>
    <button onclick="saveProgress()">進捗をセーブする</button>
  </div>

  <script>
    // 1. 端末ごとのIDを取得・発行
    function getDeviceId() {
      let id = localStorage.getItem('cm_device_id');
      if (!id) {
        id = 'dev_' + Math.random().toString(36).substring(2, 11);
        localStorage.setItem('cm_device_id', id);
      }
      return id;
    }

    // 2. セーブデータを端末（localStorage）に保存
    function saveProgress() {
      const saveData = {
        lastUpdated: new Date().toLocaleString(),
        history: ['manga_page_1']
      };
      localStorage.setItem('cm_save_data', JSON.stringify(saveData));
      loadSaveData();
      alert('端末に保存しました！');
    }

    // 3. セーブデータを読み込み
    function loadSaveData() {
      const saved = localStorage.getItem('cm_save_data');
      if (saved) {
        const data = JSON.parse(saved);
        document.getElementById('save-status').innerText = '最終更新: ' + data.lastUpdated;
      }
    }

    // 初期化表示
    document.getElementById('device-id').innerText = getDeviceId();
    loadSaveData();
  </script>
</body>
</html>
